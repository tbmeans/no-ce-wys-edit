<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Writer</title>
  <style>
    body {
      background-color: #333;
    }
    #main-container {
      background-color: #777;
      margin: 1in 1in;
      min-height: 40rem;
    }
    #main-container:focus {
      background-color: #888;
    }
    #write-space {
      white-space: pre;
      padding: 2rem 2rem;
    }
    @keyframes blinky {
      from {
        color: black;
      }
      to {
        color: gray;
      }
    }
    #cursor {
      animation: 1s infinite blinky;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="main-container" tabindex="0">
    <div id="write-space"><p><span><span id="cursor">|</span></span></p></div>
  </div>
<script>

'use strict'

const mainbox = document.getElementById("main-container");
const space = document.getElementById("write-space");
const cursor = document.getElementById("cursor");

mainbox.addEventListener("focus", (event) => {
  mainbox.addEventListener("keydown", keyfuncs);
});

mainbox.addEventListener("blur", (event) => {
  mainbox.removeEventListener("keydown", keyfuncs);
});

// Initialize with empty text node to avoid a new node for every char typed.
cursor.parentElement.insertBefore(document.createTextNode(''), cursor);

function enterHandler() {
  // This cursor parent is the current line before pressing "Enter".
  const nodes = Array.from(cursor.parentElement.childNodes);
  const index = nodes.indexOf(cursor);
  const ahead = nodes.slice(index + 1);
  const nuevo = document.createElement("SPAN");
  const nova0 = document.createTextNode('');

  /*  Clear dangling empty text nodes that'd be left behind by the cursor when
      it moves to a new line. Empty text nodes are to exist only to the left of
      the cursor when the cursor is at position 0 of a string, to provide a
      text entry area at/behind the cursor. Now when the cursor goes to a new
      line then it is at position 0 and it needs an empty node to its left,
      which is why variable "nova0" was declared. */
  nodes[0]?.nodeName === "#text" && !nodes[0].textContent.length &&
      cursor.parentElement.removeChild(nodes[0]);

  // This cursor parent is still the current line before pressing "Enter".
  cursor.parentElement.after(document.createElement("BR"), nuevo);
  nuevo.append(nova0, cursor);
  ahead.length && nuevo.append(...ahead);
  
  /*  This cursor parent is the new line formed by key "Enter".
      Must go up 2x element siblings because <BR> is between each text line
      by design. */
  const preln = cursor.parentElement.previousSibling?.previousSibling;
  const pre2l = preln?.previousSibling?.previousSibling;
  const isNewParagraphBreak = !cursor.previousSibling.textContent.length &&
          preln && !preln.textContent.length && 
              pre2l && !pre2l.textContent.length;

  // Any whitespace greater than double-spacing creates a new paragraph.
  if (isNewParagraphBreak) {
    const nextp = document.createElement("P");

    nextp.appendChild(cursor.parentElement);
    space.appendChild(nextp);
  }

  return;
}

function backspaceHandler() {
  const curnode = cursor.previousSibling;
  const curline = cursor.parentElement;
  const curpara = cursor.parentElement.parentElement;

  if (curnode.textContent.length > 0) {
    // Erasing previous keyed char
    curnode.textContent = curnode.textContent.slice(0, -1);
  /* 
      Else, curnode is empty and we're erasing newline control char
    */
  } else if (curline.previousSibling?.previousSibling) {
    /* curnode is empty, so shift up if line above
     */
    const preline = curline.previousSibling.previousSibling;
    const goingup = preline.textContent.length && 
        Array.from(curline.childNodes).slice(1) ||
            Array.from(curline.childNodes);
    /*  Empty curnode should not tag along unless prev line is empty.
        see longest comment in the above enterHandler for rationale.
      */
    preline.append(...goingup);
    curpara.removeChild(curline.previousSibling); // <BR>
    curpara.removeChild(curline); 
    /*
     */
  } else if (curpara.previousSibling) {
    /*  cur node empty & cur line 1st in cur para
        so merge cur & pre para if pre.
      */
    const prepa = curpara.previousSibling;

    prepa.removeChild(prepa.lastChild); // <BR>
    prepa.removeChild(prepa.lastChild); // term. blank line <SPAN>
    prepa.append(...Array.from(curpara.childNodes));
    /*  Sent up leading blank text node and all b/c replacing last blank/line
        of previous para. */
    space.removeChild(curpara);
  }

  // remaining, curnode empty, no paragraph above current
  return;
}

function deleteHandler() {
  const nexnode = cursor.nextSibling;
  const curline = cursor.parentElement;
  const curpara = cursor.parentElement.parentElement;

  if (nexnode && nexnode.textContent.length > 0) {
    // Erasing keyed char ahead
    nexnode.textContent = nexnode.textContent.slice(1);
  /* 
      Else empty or nothing ahead and we're bringing up next line or paragraph.
   */
  } else if (curline.nextSibling?.nextSibling) {
    /* Bring up the next line to end of current line.
     */
    const nexline = curline.nextSibling.nextSibling;
    const dangler = curline.lastChild;
    /*  We've worked it out elsewhere that there are no dangling empty nodes
        at the head of non-current lines, but we might have a dangler at the
        end of current line if we've been deleting text prior. */
    dangler !== cursor && curline.removeChild(dangler);
    nexline.textContent.length &&
        curline.append(...Array.from(nexline.childNodes));
    curpara.removeChild(curline.nextSibling); // <BR>
    curpara.removeChild(nexline); 
    /*
     */
  } else if (curpara.nextSibling) {
    /*  There's no next line below in current paragraph, so bring up entire
        next paragraph below and merge, taking 1st line of next paragraph and
        making it the line following current line of current paragraph. 
      */
    const nexpara = curpara.nextSibling;
    const dangler = curline.lastChild;
    /*  We've worked it out elsewhere that there are no dangling empty nodes
        at the head of non-current lines, but we might have a dangler at the
        end of current line if we've been deleting text prior.
      */
    dangler !== cursor && curline.removeChild(dangler);
    curpara.removeChild(curpara.lastChild); // <BR>
    curpara.removeChild(curpara.lastChild); // term. blank line <SPAN>
    curpara.append(...Array.from(nexpara.childNodes));
    space.removeChild(nexpara);
  }
  /* Remaining condition: no text rt. of cursor & cur line is last line of doc.
     So do nothing.
   */
  return;
}

function leftHandler() {
  const leftOfCurs = cursor.previousSibling;
  const ltype = leftOfCurs.nodeName;
  const ltext = leftOfCurs.textContent;
  const char1 = leftOfCurs.textContent.at(-1);
  const curline = cursor.parentElement;
  const rightOfCur = cursor.nextSibling;
  const preline = curline.previousSibling?.previousSibling;
  const prepara = curline.parentElement.previousSibling;
  
  /*  Shift char from left node to right node across cursor on same line.
      Get nodeNames on either side of cursor, and maintain the same nodeName
      container for the moved char for the sake of bold/italic/underline.
      After successive left moves of cursor, the left node's textContent
      will be empty string rather than auto-removed or null, GRANTED, THAT
      THE TEXT NODE WAS CREATED EXPLICITLY, APPENDED, AND FILLED RATHER THAN
      JUST ASSIGNING TO TEXTCONTENT WHEN THE LINE SPAN WAS EMPTY, WHICH WE DO,
      and this defines cursor at line position 0. Only on moving left from 0 do
      we then remove the empty node and put cursor at right-most text node of
      previous line OR if above line is empty, then transfer both the empty
      node and cursor into above empty line. At position 0 of line 0 of a
      paragraph, transfer cursor and its empty "curnode" on the left into the
      necessarily whitespace final line of paragraph above.
    */

  if (ltext.length && rightOfCur && ltype === rightOfCur.nodeName) {
    leftOfCurs.textContent = ltext.slice(0, -1);
    rightOfCur.textContent = char1 + rightOfCur.textContent;

  } else if (ltext.length) {
    const nexsb = ltype === '#text' && document.createTextNode('') ||
        document.createElement(ltype);

    leftOfCurs.textContent = ltext.slice(0, -1);
    nexsb.textContent = char1;
    rightOfCur && curline.insertBefore(nexsb, rightOfCur) ||
        curline.appendChild(nexsb);

  } else if (preline) {
    preline.textContent.length &&
        curline.removeChild(curline.firstChild) /* no danglers */ ||
            preline.appendChild(curline.firstChild);
    preline.appendChild(cursor);

  } else if (prepara) {
    const finline = prepara.lastChild.previousSibling;
    /* last child is <BR>, its pre-sib is final blank line
     */
    finline.append(curline.firstChild, cursor);

  }

  return;
}

function rightHandler() {
  const leftOfCurs = cursor.previousSibling;
  const rightOfCur = cursor.nextSibling;
  const rtype = rightOfCur?.nodeName;
  const rtext = rightOfCur?.textContent;
  const char1 = rightOfCur?.textContent?.at(0);
  const curline = cursor.parentElement;
  const nexline = curline.nextSibling?.nextSibling; // skip <BR>
  const nexpara = curline.parentElement.nextSibling;

  if (rtext && rtext.length && rtype === leftOfCurs.nodeName) {
    rightOfCur.textContent = rtext.slice(1);
    leftOfCurs.textContent += char1;

  } else if (rtext && rtext.length) {
    const presb = rtype === '#text' && document.createTextNode('') ||
        document.createElement(rtype);

    presb.textContent = char1;
    curline.insertBefore(presb, cursor);

  } else if (nexline) {
    nexline.firstChild && nexline.insertBefore(cursor, nexline.firstChild) ||
        nexline.appendChild(cursor); // empty nexline
    /*
      Either rt. text node is empty or does not exist and must make it. */
    rtext && nexline.insertBefore(rightOfCur, cursor) ||
        nexline.insertBefore(document.createTextNode(''), cursor);

    /*  This logic makes sure to move right-end-of-line-dangling emtpy text
        nodes down with cursor to be cursor's left neighbor for proper position
        zero, and elsewhere we ensure there's not a position 0 empty text node
        already there--only an empty where cursor is--no duplicates. 
        The previous rightHandler code was instead leaving danglers and
        creating new empty text nodes to sit left of cursor below, so when a 
        subsequent left move of cursor makes the cursor go back up but sit
        right of that dangler, the leftHandler treats the right end as 
        position 0 but there's stuff left of position 0 on the line so left
        move action can't trigger and cursor is stuck.
      */
      
  } else if (nexpara) {
    const nexpara1stLine = nexpara.firstChild;
    const nexpara1stLine1stText = nexpara.firstChild.firstChild;

    nexpara1stLine1stText && 
        nexpara1stLine.insertBefore(cursor, nexpara1stLine1stText) ||
            nexpara1stLine.appendChild(cursor);

    rtext && nexpara1stLine.insertBefore(rightOfCur, cursor) ||
        nexpara1stLine.insertBefore(document.createTextNode(''), cursor);

  }

  return;
}

function upHandler() {
  const lineAboveCur = cursor.parentElement.previousSibling;
  const paraAboveCur = cursor.parentElement.parentElement.previousSibling;
}

function downHandler() {
  const lineBelowCur = cursor.parentElement.nextSibling;
  const paraBelowCur = cursor.parentElement.parentElement.nextSibling;
}

function keyfuncs(event) {
  if (event.key === "PageUp" || event.key === "PageDown") {
    return;
  }
  event.preventDefault();
  switch(event.key) {
    case "Enter":
      enterHandler();
      break;
    case "Backspace":
      backspaceHandler();
      break;
    case "Delete":
      deleteHandler();
      break;
    case "ArrowLeft":
      leftHandler();
      break;
    case "ArrowRight":
      rightHandler();
      break;
    case "ArrowUp":
      upHandler();
      break;
    case "ArrowDown":
      downHandler();
      break;
    case "Home":
      leftHandler("all the way");
      break;
    case "End":
      rightHandler("all the way");
      break;
    case "Shift":
    case "Control":
    case "CapsLock":
    case "NumLock":
    case "Insert":
      break;
    case "Tab":
      cursor.previousSibling.textContent += '\xa0\xa0\xa0\xa0';
      break;
    default:
      cursor.previousSibling.textContent += event.key;
  }
}

</script>
</body>
</html>
