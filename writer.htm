<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Writer</title>
  <style>
    body {
      background-color: #333;
    }
    #main-container {
      background-color: #777;
      margin: 1in 1in;
      min-height: 40rem;
    }
    #main-container:focus {
      background-color: #888;
    }
    #write-space {
      white-space: pre;
      padding: 2rem 2rem;
    }
    @keyframes blinky {
      from {
        color: black;
      }
      to {
        color: gray;
      }
    }
    #cursor {
      animation: 1s infinite blinky;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="main-container" tabindex="0">
    <div id="write-space"><p><span><span id="cursor">|</span></span></p></div>
  </div>
<script>

'use strict'

const mainbox = document.getElementById("main-container");
const space = document.getElementById("write-space");
const cursor = document.getElementById("cursor");

mainbox.addEventListener("focus", (event) => {
  mainbox.addEventListener("keydown", keyfuncs);
});

mainbox.addEventListener("blur", (event) => {
  mainbox.removeEventListener("keydown", keyfuncs);
});

// Initialize with empty text node to avoid a new node for every char typed.
cursor.parentElement.insertBefore(document.createTextNode(''), cursor);

function enterHandler() {
  // This cursor parent is the current line before pressing "Enter".
  const nodes = Array.from(cursor.parentElement.childNodes);
  const index = nodes.indexOf(cursor);
  const ahead = nodes.slice(index + 1);
  const nuevo = document.createElement("SPAN");
  const nova0 = document.createTextNode('');

  /*  Clear dangling empty text nodes that'd be left behind by the cursor when
      it moves to a new line. Empty text nodes are to exist only to the left of
      the cursor when the cursor is at position 0 of a string, to provide a
      text entry area at/behind the cursor. Now when the cursor goes to a new
      line then it is at position 0 and it needs an empty node to its left,
      which is why variable "nova0" was declared. */
  nodes[0]?.nodeName === "#text" && !nodes[0].textContent.length &&
      cursor.parentElement.removeChild(nodes[0]);

  // This cursor parent is still the current line before pressing "Enter".
  cursor.parentElement.after(document.createElement("BR"), nuevo);
  nuevo.append(nova0, cursor);
  ahead.length && nuevo.append(...ahead);
  
  /*  This cursor parent is the new line formed by key "Enter".
      Must go up 2x element siblings because <BR> is between each text line
      by design. */
  const preln = cursor.parentElement.previousSibling?.previousSibling;
  const pre2l = preln?.previousSibling?.previousSibling;
  const isNewParagraphBreak = !cursor.previousSibling.textContent.length &&
          preln && !preln.textContent.length && 
              pre2l && !pre2l.textContent.length;

  // Any whitespace greater than double-spacing creates a new paragraph.
  if (isNewParagraphBreak) {
    const nextp = document.createElement("P");

    nextp.appendChild(cursor.parentElement);
    space.appendChild(nextp);
  }

  return;
}

function backspaceHandler() {
  const curnode = cursor.previousSibling;
  const curline = cursor.parentElement;
  const curpara = cursor.parentElement.parentElement;

  // Erasing previous keyed char
  if (curnode.textContent.length > 0) {
    curnode.textContent = curnode.textContent.slice(0, -1);
    return;
  }

  /* Else, erasing newline control char */

  // curnode is empty, so shift up if line above
  if (curline.previousSibling?.previousSibling) {
    const preline = curline.previousSibling.previousSibling;
    const goingup = preline.textContent.length && 
        Array.from(curline.childNodes).slice(1) ||
            Array.from(curline.childNodes);
    /*  Empty curnode should not tag along unless prev line is empty.
        see longest comment in the above enterHandler for rationale.
      */

    preline.append(...goingup);
    curpara.removeChild(curline.previousSibling); // <BR>
    curpara.removeChild(curline); 
    
    return;
  }

  // cur node empty & cur line 1st in cur para so merge cur & pre para if pre.
  if (curpara.previousSibling) {
    const prepa = curpara.previousSibling;

    prepa.removeChild(prepa.lastChild); // <BR>
    prepa.removeChild(prepa.lastChild); // term. blank line <SPAN>
    prepa.append(...Array.from(curpara.childNodes));
    /*  Sent up leading blank text node and all b/c replacing last blank/line
        of previous para. */
    space.removeChild(curpara);
  }

  // remaining, curnode empty, no paragraph above current
  return;
}

function leftHandler() {
  const leftOfCursOnLine = cursor.previousSibling;
  const rightOfCurOnLine = cursor.nextSibling;
  const curline = cursor.parentElement;
  const lineAboveCur = curline?.previousSibling?.previousSibling; // skip <BR>
  const paraAboveCur = curline?.parentElement?.previousSibling;
  const isAtLinePos0 = !leftOfCursOnLine || 
      leftOfCursOnLine.textContent.length === 0;

  if (isAtLinePos0 && !lineAboveCur && !paraAboveCur) {
    console.log("we are having a problem with moving back to the left after moving right across line boundary")
    return;
  } else if (isAtLinePos0 && !lineAboveCur) {
    paraAboveCur.lastChild.previousSibling.previousSibling.appendChild(cursor);
  } else if (isAtLinePos0) {
    lineAboveCur.appendChild(cursor);
  }

  if (isAtLinePos0) {
    return;
  }
  // else shift char from left to right across cursor on same line:

  const char1 = leftOfCursOnLine.textContent.at(-1);
  const ltype = leftOfCursOnLine.nodeName;
  const rtype = rightOfCurOnLine?.nodeName;
  const nexsb = ltype === '#text' && (document.createTextNode('')) ||
      document.createElement(ltype);

  nexsb.textContent = char1;
  leftOfCursOnLine.textContent = leftOfCursOnLine.textContent.slice(0, -1);

  if (rtype != null && ltype === rtype) {
    rightOfCurOnLine.textContent = char1 + rightOfCurOnLine.textContent;
  } else if (rtype != null) {
    cursor.parentElement.insertBefore(nexsb, rightOfCurOnLine);
  } else {
    cursor.parentElement.appendChild(nexsb);
  }

  return;
}

function rightHandler() {
  const leftOfCursOnLine = cursor.previousSibling;
  const rightOfCurOnLine = cursor.nextSibling;
  const curline = cursor.parentElement;
  const isAtEndOfLine = curline.lastChild === cursor ||
      (rightOfCurOnLine.textContent ?? '').length === 0;
  const nexline = curline.nextSibling?.nextSibling; // skip <BR>
  const isNoBreakBelow = nexline == null;
  const isAtEndOfNonFinalPara = nexline?.nodeName === "BR" &&
      nexline.nextSibling.textContent === '\xa0';  

  if (isAtEndOfLine && isNoBreakBelow) {
    console.log("we are having a problem with moving back to the right after moving left across line boundary")
    return;
  } else if (isAtEndOfLine && isAtEndOfNonFinalPara) {
    const nexpara = curline.parentElement.nextSibling;
    const nex1stline = nexpara.firstChild;
    const nex1stnode = nex1stline.firstChild;
    nex1stnode && ( nex1stline.insertBefore(cursor, nex1stnode) ) || (
        nex1stline.appendChild(cursor) );
    nex1stline.insertBefore(document.createTextNode(''), cursor);
  } else if (isAtEndOfLine) {
    const nex1stnode = nexline.firstChild;
    nex1stnode && ( nexline.insertBefore(cursor, nex1stnode) ) || (
        nexline.appendChild(cursor) );
    nexline.insertBefore(document.createTextNode(''), cursor);
  }

  if (isAtEndOfLine) {
    return;
  } // else shift char from right to left across cursor on same line:

  const char1 = rightOfCurOnLine.textContent[0];
  const ltype = leftOfCursOnLine.nodeName;
  const rtype = rightOfCurOnLine.nodeName;
  const presb = rtype === '#text' && (document.createTextNode('')) ||
      document.createElement(rtype);

  presb.textContent = char1;
  rightOfCurOnLine.textContent = rightOfCurOnLine.textContent.slice(1);

  if (ltype === rtype) {
    leftOfCursOnLine.textContent += char1;
  } else {
    curline.insertBefore(presb, cursor);
  }

  return;
}

function upHandler() {
  const lineAboveCur = cursor.parentElement.previousSibling;
  const paraAboveCur = cursor.parentElement.parentElement.previousSibling;
}

function downHandler() {
  const lineBelowCur = cursor.parentElement.nextSibling;
  const paraBelowCur = cursor.parentElement.parentElement.nextSibling;
}

function keyfuncs(event) {
  if (event.key === "PageUp" || event.key === "PageDown") {
    return;
  }
  event.preventDefault();
  switch(event.key) {
    case "Enter":
      enterHandler();
      break;
    case "Backspace":
      backspaceHandler();
      break;
    case "Delete":
      deleteHandler();
      break;
    case "ArrowLeft":
      leftHandler();
      break;
    case "ArrowRight":
      rightHandler();
      break;
    case "ArrowUp":
      upHandler();
      break;
    case "ArrowDown":
      downHandler();
      break;
    case "Home":
      leftHandler("all the way");
      break;
    case "End":
      rightHandler("all the way");
      break;
    case "Shift":
    case "Control":
    case "CapsLock":
    case "NumLock":
    case "Insert":
      break;
    case "Tab":
      cursor.previousSibling.textContent += '\xa0\xa0\xa0\xa0';
      break;
    default:
      cursor.previousSibling.textContent += event.key;
  }
}

</script>
</body>
</html>
