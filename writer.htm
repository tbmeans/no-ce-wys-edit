<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Writer</title>
  <style>
    body {
      background-color: #333;
    }
    #main-container {
      background-color: #777;
      margin: 1in 1in;
      min-height: 40rem;
    }
    #main-container:focus {
      background-color: #888;
    }
    #write-space {
      white-space: pre;
      padding: 2rem 2rem;
    }
    @keyframes blinky {
      from {
        color: black;
      }
      to {
        color: gray;
      }
    }
    #cursor {
      animation: 1s infinite blinky;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="main-container" tabindex="0">
    <div id="write-space"><p><span><span id="cursor">|</span></span></p></div>
  </div>
<script>

'use strict'

const mcont = document.getElementById("main-container");
const space = document.getElementById("write-space");
const cursor = document.getElementById("cursor");

mcont.addEventListener("focus", (event) => {
  mcont.addEventListener("keydown", keyfuncs);
});

mcont.addEventListener("blur", (event) => {
  mcont.removeEventListener("keydown", keyfuncs);
});

// Initialize with empty text node to avoid a new node for every char typed.
cursor.parentElement.insertBefore(document.createTextNode(''), cursor);

function getText(node) {
  return Array.from(node.childNodes);
}

function shiftUp(node) {
  if (!node.previousSibling) {
    return;
  }

  if (node.previousSibling.nodeName === "BR") {
    node.parentElement.removeChild(node.previousSibling);
  }

  /* Removes empty current text node so that final text node of
   * previous line can become the new current text node to write in. */
  if (node.nodeName === "SPAN") {
    node.removeChild(node.firstChild);
  } 

  // Delete terminal &nbsp; whitespace of prev. paragraph.
  if (node.nodeName === "P") {
    const prepara = node.previousSibling;
    prepara.removeChild(prepara.lastChild);
  } 

  // And now, the shifting up:
  getText(node).forEach(child => {
    node.previousSibling.appendChild(child);
  });

  // clean up
  node.parentElement.removeChild(node);

  return;
}

function delahead(node) {
  if (!node.nextSibling) {
    return;
  }

  if (node.nextSibling.nodeName === "BR") {
    node.parentElement.removeChild(node.nextSibling);
  }

  // is this not kicking in?
  if (node.nodeName === "P" && node.lastChild.textContent === '\xa0') {
    node.removeChild(node.lastChild);
  }

  getText(node.nextSibling).forEach(child => {
    node.appendChild(child);
  });
  
  node.parentElement.removeChild(node.nextSibling);

  return;
}

function charEdit(value) {
  const curnode = cursor.previousSibling;
  const curtexlen = curnode.textContent.length;
  const nexnode = cursor.nextSibling; 
  const curline = cursor.parentElement;
  const curlineAll = getText(curline);
  const curpos = curlineAll.indexOf(cursor);
  const rtOfCur = curlineAll.slice(curpos + 1); // Enter key pushes text fwd.
  const curpara = curline.parentElement;
  const curparAll = getText(curpara); 
  const curLineIdx = curparAll.indexOf(curline);
  const beloCur = curparAll.slice(curLineIdx + 1); // Enter key pushes txt fwd.
  const isAtLinePos0 = curtexlen === 0;
  const isDangler = nexnode && nexnode.textContent.length === 0;
      /* Plan to remove empty nodes right of cursor so that
       * they need not be considered for "isAtEndOfLine". */
  const is1stLineOfPara = curline.previousSibling == null;
  const isAtEndOfLine = curline.lastChild === cursor;
  const isAtEndOfPara = curpara.lastChild === curline ||
      curpara.lastChild && curpara.lastChild.textContent === '\xa0';
  const controlkeys = () => "Enter,Backspace,Delete,Tab".split(',');

  if (value === "Enter" && isAtLinePos0) {
    /* If 1st key entered left of cursor is '\n' then new paragraph. */
    const nexline = document.createElement("SPAN");
    const nexpara = document.createElement("P");
    const dangle1 = document.createElement("SPAN");
    const dangle2 = document.createElement("BR");
    curnode.textContent = '\xa0'; /* final line of paragraph 
      and blank paragraphs become white space */
    nexline.appendChild(document.createTextNode(''));
    nexline.appendChild(cursor);
    nexline.append(...rtOfCur);
    nexpara.appendChild(nexline);
    nexpara.append(...beloCur);
    space.appendChild(nexpara);
    Array.from(curpara.childNodes).length === 1 && (
        curpara.insertBefore(dangle1, curpara.lastChild) );
    Array.from(curpara.childNodes).length === 2 && (
        curpara.insertBefore(dangle2, curpara.lastChild) );
  } else if (value === "Enter") {
    /* new line w/in cur paragraph */
    const nexline = document.createElement("SPAN");
    nexline.appendChild(document.createTextNode(''));
    nexline.appendChild(cursor);
    nexline.append(...rtOfCur);
    curpara.appendChild(document.createElement("BR"));
    curpara.appendChild(nexline);
  }

  if (value === "Backspace" && isAtLinePos0 && is1stLineOfPara) {
    shiftUp(curpara);
  } else if (value === "Backspace" && isAtLinePos0) {
    shiftUp(curline);
  } else if (value === "Backspace") {
    curnode.textContent = curnode.textContent.slice(0, -1);
  }

  if (value === "Delete" && isAtEndOfLine && isAtEndOfPara) {
    delahead(curpara);
  } else if (value === "Delete" && isAtEndOfLine) {
    delahead(curline);
  } else if (value === "Delete") {
    nexnode.textContent = nexnode.textContent.slice(1);
    isDangler && ( curline.removeChild(nexnode) );
  }

  /* Another potential dangler is backspacing until empty rich/text node and
   then moving cursor. In that case move the potential dangler along WITH
   cursor. WAIT NO because what if a text node was emptied and then you move
   inside a rich text node? In that case, the dangler should be destroyed as it
   is here when you delete at position 0 in a line. */

  // Tab is 4 spaces
  if (value === "Tab") {
    curnode.textContent += '\xa0\xa0\xa0\xa0';
  }

  if ( controlkeys().every(name => name !== value) ) {
    curnode.textContent += value;
  }

  return;
}

function leftHandler() {
  const leftOfCursOnLine = cursor.previousSibling;
  const rightOfCurOnLine = cursor.nextSibling;
  const curline = cursor.parentElement;
  const lineAboveCur = curline?.previousSibling?.previousSibling; // skip <BR>
  const paraAboveCur = curline?.parentElement?.previousSibling;
  const isAtLinePos0 = !leftOfCursOnLine || 
      leftOfCursOnLine.textContent.length === 0;

  if (isAtLinePos0 && !lineAboveCur && !paraAboveCur) {
    console.log("we are having a back and forth from end of one line to beginning of next line problem")
    /* solution: when left cursor has moved to left end of text node, CODE SHOULD ENSURE 
    that an empty text node remains still to left of cursor. this might alreayd be happening, but what may still be lacking is to LEAVE that empty node there when cursor goes up to prev line, leave it there as a place to come back down to, but cursor going always to right of empty node never left of empty node. how we judge need for transition up to above line must always be based on when the node left of cursor is empty. but we never have an empty node right of cursor. in case of going down a line with right arrow, cursor really is lastchild of line. now for the utmost edge case at top and bottom of text
    yeah still an empty node is leftmost, and curline is first child of first para,
    and for bottom curline is last child of last para. Well that is what these conditions
    seem to be, so the problem is that boundary from one line to next is getting treated
    like this edge case. hopeful that proper leaving behind empty node to lead a line
    will keep the 2 lines boundary problem from becoming an edge case? */
    return;
  } else if (isAtLinePos0 && !lineAboveCur) {
    paraAboveCur.lastChild.previousSibling.previousSibling.appendChild(cursor);
  } else if (isAtLinePos0) {
    lineAboveCur.appendChild(cursor);
  }

  if (isAtLinePos0) {
    return;
  }
  // else shift char from left to right across cursor on same line:

  const char1 = leftOfCursOnLine.textContent.at(-1);
  const ltype = leftOfCursOnLine.nodeName;
  const rtype = rightOfCurOnLine?.nodeName;
  const nexsb = ltype === '#text' && (document.createTextNode('')) ||
      document.createElement(ltype);

  nexsb.textContent = char1;
  leftOfCursOnLine.textContent = leftOfCursOnLine.textContent.slice(0, -1);

  if (rtype != null && ltype === rtype) {
    rightOfCurOnLine.textContent = char1 + rightOfCurOnLine.textContent;
  } else if (rtype != null) {
    cursor.parentElement.insertBefore(nexsb, rightOfCurOnLine);
  } else {
    cursor.parentElement.appendChild(nexsb);
  }

  return;
}

function rightHandler() {
  const leftOfCursOnLine = cursor.previousSibling;
  const rightOfCurOnLine = cursor.nextSibling;
  const curline = cursor.parentElement;
  const isAtEndOfLine = curline.lastChild === cursor ||
      (rightOfCurOnLine.textContent ?? '').length === 0;
  const nexline = curline.nextSibling?.nextSibling; // skip <BR>
  const isNoBreakBelow = nexline == null;
  const isAtEndOfNonFinalPara = nexline?.nodeName === "BR" &&
      nexline.nextSibling.textContent === '\xa0';  

  if (isAtEndOfLine && isNoBreakBelow) {
    console.log("we are having a back and forth from end of one line to beginning of next line problem")
    return;
  } else if (isAtEndOfLine && isAtEndOfNonFinalPara) {
    const nexpara = curline.parentElement.nextSibling;
    const nex1stline = nexpara.firstChild;
    const nex1stnode = nex1stline.firstChild;
    nex1stnode && ( nex1stline.insertBefore(cursor, nex1stnode) ) || (
        nex1stline.appendChild(cursor) );
    nex1stline.insertBefore(document.createTextNode(''), cursor);
  } else if (isAtEndOfLine) {
    const nex1stnode = nexline.firstChild;
    nex1stnode && ( nexline.insertBefore(cursor, nex1stnode) ) || (
        nexline.appendChild(cursor) );
    nexline.insertBefore(document.createTextNode(''), cursor);
  }

  if (isAtEndOfLine) {
    return;
  } // else shift char from right to left across cursor on same line:

  const char1 = rightOfCurOnLine.textContent[0];
  const ltype = leftOfCursOnLine.nodeName;
  const rtype = rightOfCurOnLine.nodeName;
  const presb = rtype === '#text' && (document.createTextNode('')) ||
      document.createElement(rtype);

  presb.textContent = char1;
  rightOfCurOnLine.textContent = rightOfCurOnLine.textContent.slice(1);

  if (ltype === rtype) {
    leftOfCursOnLine.textContent += char1;
  } else {
    curline.insertBefore(presb, cursor);
  }

  return;
}

function upHandler() {
  const lineAboveCur = cursor.parentElement.previousSibling;
  const paraAboveCur = cursor.parentElement.parentElement.previousSibling;
}

function downHandler() {
  const lineBelowCur = cursor.parentElement.nextSibling;
  const paraBelowCur = cursor.parentElement.parentElement.nextSibling;
}

function moveCurs(directionKeyName) {
  const dname = directionKeyName.replace("Arrow", '');
  const index = "Left,Right,Up,Down".split(',').indexOf(dname);

  [ leftHandler, rightHandler, upHandler, downHandler ][index]();
  return;
}

function keyfuncs(event) {
  if (event.key === "PageUp" || event.key === "PageDown") {
    return;
  }
  event.preventDefault();
  switch(event.key) {
    case "ArrowLeft":
    case "ArrowRight":
    case "ArrowUp":
    case "ArrowDown":
    case "Home":
    case "End":
      moveCurs(event.key);
      break;
    case "Shift":
    case "Control":
    case "CapsLock":
    case "NumLock":
    case "Insert":
      break;
    default:
      charEdit(event.key);
  }
}

</script>
</body>
</html>
